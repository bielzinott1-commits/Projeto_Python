{% extends "base.html" %}{% block title %}Registrar bem{% endblock %}{% block page_heading %}Registrar bem{% endblock %}{% block content %}<div class="page-heading"><div><span class="eyebrow">INVENTÁRIO DEMONSTRATIVO</span><h1>Novo registro de bem</h1><p>Não utilize informações de bens ou processos reais.</p></div><a class="button button-secondary" href="{{ url_for('apprehensions.index') }}">← Voltar</a></div><section class="panel form-panel"><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Descrição do bem *<input name="description" maxlength="200" required placeholder="Ex.: Equipamento fictício"></label><label>Categoria *<select name="category" required><option value="">Selecione</option>{% for c in ['Equipamento','Documento demonstrativo','Objeto fictício','Outro'] %}<option>{{ c }}</option>{% endfor %}</select></label><div class="form-row"><label>Quantidade *<input type="number" min="1" max="100000" name="quantity" value="1" required></label><label>Local fictício de armazenamento *<input name="storage_location" maxlength="120" required placeholder="Ex.: Depósito DEMO A"></label></div><label>Ocorrência relacionada<select name="occurrence_id"><option value="">Sem vínculo</option>{% for o in occurrences %}<option value="{{ o.id }}">{{ o.protocol }} — {{ o.title }}</option>{% endfor %}</select></label><div class="form-actions"><a class="button button-secondary" href="{{ url_for('apprehensions.index') }}">Cancelar</a><button class="button button-primary">Salvar bem</button></div></form></section>{% endblock %}
