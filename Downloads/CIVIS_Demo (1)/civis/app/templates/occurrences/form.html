{% extends "base.html" %}{% block title %}Nova ocorrência{% endblock %}{% block page_heading %}Nova ocorrência{% endblock %}{% block content %}<div class="page-heading"><div><span class="eyebrow">NOVO REGISTRO</span><h1>Cadastrar ocorrência</h1><p>Use apenas informações inventadas para demonstração.</p></div><a class="button button-secondary" href="{{ url_for('occurrences.index') }}">← Voltar</a></div><section class="panel form-panel"><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Título do registro *<input name="title" maxlength="160" required placeholder="Ex.: Registro demonstrativo de patrimônio"></label><label>Categoria *<select name="category" required><option value="">Selecione uma categoria</option>{% for c in ['Administrativa','Patrimônio fictício','Documental','Demonstrativa','Outra'] %}<option>{{ c }}</option>{% endfor %}</select></label><label>Descrição<textarea name="description" rows="5" maxlength="5000" placeholder="Descreva o registro fictício..."></textarea></label><div class="form-actions"><a class="button button-secondary" href="{{ url_for('occurrences.index') }}">Cancelar</a><button class="button button-primary">Salvar registro</button></div></form></section>{% endblock %}
